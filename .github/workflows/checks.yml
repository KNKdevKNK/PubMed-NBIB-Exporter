name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Offline regression tests
        run: node test.mjs
      - name: Syntax and manifest checks
        run: node scripts/check.mjs
      - name: Package extension
        run: python3 scripts/package.py
      - name: Verify package matches committed build
        run: git diff --exit-code -- dist
      - name: Verify checksum
        run: sha256sum --check SHA256SUMS.txt
        working-directory: dist
